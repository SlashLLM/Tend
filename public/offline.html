<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Tend</title>
<style>
  :root { --bg: #faf8f5; --card: #ffffff; --text: #1d2420; --muted: #58615b; --primary: #1f5e55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141816; --card: #1c211f; --text: #e8ece9; --muted: #a3aca6; --primary: #7cc4b8; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.5 "Noto Sans", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 26rem; background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
  h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--primary); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--primary); color: var(--bg); font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You’re offline</h1>
  <p>This page needs a connection. Anything you captured is saved on this device and uploads by itself when the signal is back.</p>
  <p class="muted" lang="zh-Hans">您目前离线。已记录的内容保存在此设备上，恢复网络后会自动上传。</p>
  <p class="muted" lang="ms-SG">Anda di luar talian. Apa yang telah dirakam disimpan pada peranti ini dan dimuat naik sendiri apabila isyarat kembali.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
